    <!-- =========================
         BACKGROUND MUSIC - 1000X
    ========================= -->

    <div id="music-container" style="position: fixed; bottom: 25px; right: 25px; z-index: 9998; background: rgba(255, 248, 250, 0.92); backdrop-filter: blur(8px); border-radius: 50px; padding: 10px 20px 10px 16px; box-shadow: 0 6px 30px rgba(120, 50, 80, 0.25); display: flex; align-items: center; gap: 12px; font-family: Georgia, serif; font-size: 14px; color: #8f405d; border: 1px solid rgba(168, 79, 109, 0.15);">

        <button id="musicToggle" style="background: #a84f6d; color: white; border: none; border-radius: 50%; width: 42px; height: 42px; font-size: 18px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(168, 79, 109, 0.3);">
            🔊
        </button>

        <div style="display: flex; flex-direction: column; line-height: 1.3;">
            <span style="font-size: 13px; font-weight: bold; color: #8f405d;">🎵 1000X</span>
            <span style="font-size: 10px; color: #a87a86;">Ghea Indrawari</span>
        </div>

    </div>

    <!-- YouTube iframe (disembunyikan) -->
    <iframe id="youtubeMusic" width="0" height="0" src="https://www.youtube.com/embed/V6cQ4LyvOgg?autoplay=1&loop=1&playlist=V6cQ4LyvOgg&enablejsapi=1" style="display: none;" allow="autoplay; encrypted-media"></iframe>

    <script>
        const musicIframe = document.getElementById('youtubeMusic');
        const musicBtn = document.getElementById('musicToggle');
        let musicPlaying = true;
        let playAttempt = 0;

        // Fungsi untuk mencoba memutar
        function tryPlay() {
            // Reload iframe untuk mencoba autoplay lagi
            musicIframe.src = `https://www.youtube.com/embed/V6cQ4LyvOgg?autoplay=1&loop=1&playlist=V6cQ4LyvOgg&enablejsapi=1`;
        }

        // Coba putar otomatis
        tryPlay();

        // Jika autoplay gagal, user harus klik tombol
        musicBtn.addEventListener('click', function() {
            if (musicPlaying) {
                // Pause: kosongkan src
                musicIframe.src = '';
                musicBtn.textContent = '🔇';
                musicBtn.style.background = '#8f8f8f';
                musicPlaying = false;
            } else {
                // Play: reload iframe
                tryPlay();
                musicBtn.textContent = '🔊';
                musicBtn.style.background = '#a84f6d';
                musicPlaying = true;
            }
        });

        // Deteksi jika user mengklik tombol pause di YouTube (opsional)
        console.log('🎵 Background music: 1000X - Ghea Indrawari');
    </script>
